services:
  - type: web
    name: ai-casual-english-keyboard-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: OPENROUTER_MODEL
        value: inclusionai/ling-3.0-flash:free
      - key: OPENROUTER_API_KEY
        sync: false
